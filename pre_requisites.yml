
---

- name: Get the full path to python{{ upgrade_python3 }}
  ansible.builtin.command: command -v python"{{ upgrade_python3 }}"
  register: upgrade_python3_path
  changed_when: false
  failed_when: "upgrade_python3_path.rc != 0"

# ------------ Get pip3.xx executable path -------------- #
- name: Get pip executable path for python{{ upgrade_python3 }}
  ansible.builtin.command: >
    {{ upgrade_python3_path.stdout }}
    -c "import sysconfig, os; print(os.path.join(sysconfig.get_path('scripts'), 'pip{{ upgrade_python3 }}'))"
  register: pip_executable_path
  changed_when: false

# ------------ Create project directories ------------ # 
- name: Create project directories
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  loop:
    - venv  # for python virtual environment
    - work  # for other project related if needed

# ----------------------------- Dnf Install Tools --------------------------- #
- name: Install EPEL GPG key
  become: true
  ansible.builtin.rpm_key:
    key: https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-9
    state: present

- name: Install Dev Tools on RHEL 9 via dnf
  become: true
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  loop: "{{ dnf_install_tools }}"

# ----------------------------- Install ngrok --------------------------- #
- name: Download ngrok zip
  ansible.builtin.get_url:
    url: "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-stable-linux-amd64.zip"
    dest: "/tmp/ngrok.zip"
    mode: '0644'
  become: true

- name: Unzip ngrok binary
  ansible.builtin.unarchive:
    src: "/tmp/ngrok.zip"
    dest: "/tmp"
    remote_src: true
  become: true

- name: Move ngrok to /usr/local/bin
  ansible.builtin.copy:
    src: "/tmp/ngrok"
    dest: "/usr/local/bin/ngrok"
    remote_src: true
    mode: '0755'
  become: true
  
- name: Verify ngrok is installed
  ansible.builtin.command: "/usr/local/bin/ngrok version"
  register: ngrok_version
  changed_when: false

- name: Print ngrok version
  ansible.builtin.debug:
    msg: "{{ ngrok_version.stdout }}"

