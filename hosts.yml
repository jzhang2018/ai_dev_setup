---

all:
  vars:
    ansible_user: iacuser
    upgrade_python3: 3.11
    dnf_install_tools:  # system level
      - https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm
      - make
      - gcc
      - readline-devel
      - openssl-devel
      - wget
      - sshpass
    
    pip_install_tools:  # virtual env (could be system, user level)
      - pytest
      - python-dotenv
      - openai
      - langchain

  children:
    agentic_sandbox:
      hosts:
        agentic_sandbox_node:
          ansible_host: 192.168.184.138 # hostname rhel9-a3
          ansible_connection: ssh          
          max_steps: 1
          openai_api_key: "<YOUR API KEY>"